<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Gif Machine — GIFs para Discord (≤ 8MB)</title>
  <meta name="description" content="Converta vídeos e baixe GIFs do Twitter/X perfeitamente otimizados para o limite de 8MB do Discord com suporte a legenda estilo meme.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            meme: ['"Futura Condensed Extra Bold"', 'Futura-CondensedExtraBold', 'Impact', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="lib/gifshot.min.js"></script>
  <script>
    if (!window.gifshot) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"><\/script>');
    }
  </script>

  <style>
    @font-face {
      font-family: 'Futura Condensed Extra Bold';
      src: url('Futura Condensed Extra Bold.otf') format('opentype'),
           url('public/Futura Condensed Extra Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
    }
    input, select, button, textarea {
      outline: none;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0a0a0a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }

    .meme-font {
      font-family: 'Futura Condensed Extra Bold', 'Futura', sans-serif;
      font-weight: bold;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-white selection:text-black">

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-12 flex flex-col gap-6">

    <!-- Minimal Discord Gif Machine Header -->
    <header class="flex items-baseline justify-between border-b border-neutral-800 pb-3">
      <div>
        <h1 class="font-mono text-sm tracking-tight text-white font-semibold flex items-center gap-1.5">
          <span class="text-[#5865F2]">&bull;</span> discord gif machine
        </h1>
      </div>
      <span id="headerLimitTag" class="font-mono text-xs text-neutral-500">
        modo: discord (&le; 8mb)
      </span>
    </header>

    <!-- Subtitle / Context -->
    <p class="font-mono text-xs text-neutral-500 -mt-3">
      converta vídeos e tweets para gifs leves prontos para envio no discord
    </p>

    <!-- Input Bar -->
    <form id="urlForm" class="flex flex-col gap-2">
      <div class="flex items-center bg-neutral-900 border border-neutral-800 rounded focus-within:border-neutral-500 transition">
        <input 
          id="tweetUrlInput" 
          type="text" 
          placeholder="Cole o link do post (x.com ou twitter.com)..." 
          class="flex-1 bg-transparent px-3 py-2.5 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none"
          autocomplete="off"
        />
        <button 
          type="button" 
          id="pasteBtn" 
          class="px-2.5 py-1 mr-1.5 text-xs font-mono text-neutral-400 hover:text-white bg-neutral-800 hover:bg-neutral-700 rounded transition"
        >
          colar
        </button>
        <button 
          type="submit" 
          id="fetchBtn" 
          class="px-4 py-2.5 text-xs font-mono font-semibold bg-white text-black hover:bg-neutral-200 transition rounded-r shrink-0"
        >
          buscar
        </button>
      </div>

      <div class="flex items-center justify-between text-[11px] font-mono text-neutral-600 px-1">
        <span>ou arraste um vídeo</span>
        <label class="cursor-pointer hover:text-neutral-400 transition">
          escolher arquivo
          <input type="file" id="localFileInput" accept="video/mp4,video/webm" class="hidden">
        </label>
      </div>
    </form>

    <!-- Status / Error message -->
    <div id="statusMsg" class="hidden font-mono text-xs p-2.5 bg-neutral-900 border rounded"></div>

    <!-- Media Selector (if tweet has multiple videos) -->
    <div id="mediaSelector" class="hidden flex gap-2 overflow-x-auto pb-1 custom-scrollbar"></div>

    <!-- Media Preview Container (Only Media, No Tweet Text) -->
    <section id="previewContainer" class="hidden flex flex-col gap-4 border border-neutral-800 bg-neutral-900/40 p-3 rounded">
      
      <!-- Video & Meme Live Preview Wrapper -->
      <div class="relative bg-black rounded overflow-hidden flex flex-col items-center justify-center max-h-[520px]">
        
        <!-- Live Caption Top Banner Preview (Above the video content) -->
        <div id="captionLiveBanner" class="hidden w-full bg-white text-black text-center px-4 py-3.5 meme-font leading-tight text-2xl sm:text-3xl break-words select-none transition-all">
          esmbot captioning gifs be like
        </div>

        <video id="previewVideo" class="max-h-[440px] w-auto max-w-full" controls loop muted playsinline></video>
      </div>

      <!-- Caption Toggle Button & Editor Box -->
      <div class="flex flex-col gap-2 pt-1 border-t border-neutral-800/80">
        
        <!-- Caption Toggle Row -->
        <div class="flex items-center justify-between">
          <button 
            type="button" 
            id="toggleCaptionBtn" 
            class="px-3 py-1.5 text-xs font-mono border border-neutral-700 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 hover:text-white rounded transition flex items-center gap-1.5"
          >
            <span id="captionBtnIcon">+</span>
            <span id="captionBtnText">adicionar legenda (caption)</span>
          </button>
          
          <button 
            type="button" 
            id="clearCaptionBtn" 
            class="hidden text-[11px] font-mono text-red-400 hover:text-red-300 transition"
          >
            remover legenda
          </button>
        </div>

        <!-- Caption Input Panel (Hidden by default until clicked) -->
        <div id="captionEditorPanel" class="hidden flex flex-col gap-2 bg-neutral-900/80 p-3 rounded border border-neutral-800">
          <label class="font-mono text-[11px] text-neutral-400">texto da legenda (fonte Futura Condensed Extra Bold):</label>
          <textarea 
            id="captionInput" 
            rows="2" 
            placeholder="Digite o texto da legenda do meme..." 
            class="w-full bg-black border border-neutral-700 rounded p-2 text-sm text-white placeholder-neutral-500 focus:border-neutral-400 focus:outline-none resize-none meme-font"
          ></textarea>
        </div>
      </div>

      <!-- Action & 2 Conversion Modes -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2 border-t border-neutral-800/80">
        <div class="flex items-center gap-2 font-mono text-xs text-neutral-400 w-full sm:w-auto">
          <span>modo de conversão:</span>
          <select id="modeSelect" class="bg-neutral-900 border border-neutral-800 text-neutral-200 rounded px-2.5 py-1 text-xs focus:outline-none">
            <option value="discord" selected>Discord (&le; 8MB)</option>
            <option value="standard">Conversão Padrão (&le; 20MB)</option>
          </select>
        </div>

        <button 
          type="button" 
          id="convertBtn" 
          class="w-full sm:w-auto px-5 py-2 text-xs font-mono font-bold bg-white text-black hover:bg-neutral-200 rounded transition"
        >
          gerar gif para discord
        </button>
      </div>
    </section>

    <!-- Progress Indicator -->
    <div id="progressContainer" class="hidden flex flex-col gap-2 p-3 border border-neutral-800 bg-neutral-900/50 rounded font-mono text-xs">
      <div class="flex justify-between text-neutral-400">
        <span id="progressText">gerando gif...</span>
        <span id="progressTimer">0s</span>
      </div>
      <div class="w-full bg-neutral-800 h-1 rounded overflow-hidden">
        <div id="progressBar" class="bg-white h-full w-0 transition-all duration-200"></div>
      </div>
    </div>

    <!-- Result GIF Section -->
    <section id="resultContainer" class="hidden flex flex-col gap-3 border border-neutral-800 bg-neutral-900/50 p-3 rounded">
      <div class="relative bg-black rounded overflow-hidden flex items-center justify-center max-h-[520px]">
        <img id="resultGif" src="" alt="GIF Result" class="max-h-[520px] w-auto max-w-full">
      </div>

      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-1 font-mono text-xs">
        <div class="text-neutral-400">
          tamanho: <span id="gifSizeText" class="text-white font-bold">0.0 MB</span>
          <span id="gifLimitText" class="text-neutral-600 ml-1">(&le; 8.0 MB)</span>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <a 
            id="downloadLink" 
            href="#" 
            download="discord_gif.gif" 
            class="flex-1 sm:flex-none text-center px-4 py-2 bg-white text-black font-semibold rounded hover:bg-neutral-200 transition"
          >
            baixar gif
          </a>
          <button 
            id="copyBtn" 
            type="button" 
            class="px-3 py-2 border border-neutral-700 text-neutral-300 hover:text-white hover:border-neutral-500 rounded transition"
          >
            copiar
          </button>
          <a 
            href="https://klipy.com/create" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="px-3 py-2 border border-[#8800FF]/50 text-[#c084fc] hover:text-white hover:border-[#8800FF] hover:bg-[#8800FF]/20 rounded transition text-center"
          >
            postar no klipy
          </a>
        </div>
      </div>
    </section>

  </main>

  <!-- Client-side Logic -->
  <script>
    // Limits
    const LIMITS = {
      discord: 8 * 1024 * 1024,   // 8 MB
      standard: 20 * 1024 * 1024  // 20 MB
    };

    // Elements
    const urlForm = document.getElementById('urlForm');
    const tweetUrlInput = document.getElementById('tweetUrlInput');
    const pasteBtn = document.getElementById('pasteBtn');
    const fetchBtn = document.getElementById('fetchBtn');
    const localFileInput = document.getElementById('localFileInput');
    const headerLimitTag = document.getElementById('headerLimitTag');

    const statusMsg = document.getElementById('statusMsg');
    const mediaSelector = document.getElementById('mediaSelector');
    
    const previewContainer = document.getElementById('previewContainer');
    const previewVideo = document.getElementById('previewVideo');
    const captionLiveBanner = document.getElementById('captionLiveBanner');
    const toggleCaptionBtn = document.getElementById('toggleCaptionBtn');
    const clearCaptionBtn = document.getElementById('clearCaptionBtn');
    const captionBtnIcon = document.getElementById('captionBtnIcon');
    const captionBtnText = document.getElementById('captionBtnText');
    const captionEditorPanel = document.getElementById('captionEditorPanel');
    const captionInput = document.getElementById('captionInput');

    const modeSelect = document.getElementById('modeSelect');
    const convertBtn = document.getElementById('convertBtn');

    const progressContainer = document.getElementById('progressContainer');
    const progressText = document.getElementById('progressText');
    const progressTimer = document.getElementById('progressTimer');
    const progressBar = document.getElementById('progressBar');

    const resultContainer = document.getElementById('resultContainer');
    const resultGif = document.getElementById('resultGif');
    const gifSizeText = document.getElementById('gifSizeText');
    const gifLimitText = document.getElementById('gifLimitText');
    const downloadLink = document.getElementById('downloadLink');
    const copyBtn = document.getElementById('copyBtn');

    // State
    let activeMediaList = [];
    let selectedMediaIndex = 0;
    let timerInterval = null;
    let timerCount = 0;
    let currentGifBlob = null;
    let isCaptionActive = false;

    // Helpers
    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.className = `font-mono text-xs p-2.5 rounded border ${isError ? 'bg-red-950/40 border-red-900 text-red-300' : 'bg-neutral-900 border-neutral-800 text-neutral-400'}`;
      statusMsg.classList.remove('hidden');
    }

    function hideStatus() {
      statusMsg.classList.add('hidden');
    }

    function extractTweetId(url) {
      if (!url) return null;
      const str = url.trim();
      if (/^\d{5,25}$/.test(str)) return str;
      const m = str.match(/(?:twitter\.com|x\.com|vxtwitter\.com|fxtwitter\.com)\/(?:#!\/)?(?:[a-zA-Z0-9_]+)\/status(?:es)?\/(\d+)/i)
        || str.match(/(?:twitter\.com|x\.com)\/i\/(?:web\/)?status\/(\d+)/i)
        || str.match(/\/status\/(\d+)/i);
      return m ? m[1] : null;
    }

    modeSelect.addEventListener('change', () => {
      if (modeSelect.value === 'discord') {
        headerLimitTag.textContent = 'modo: discord (≤ 8mb)';
      } else {
        headerLimitTag.textContent = 'modo: padrão (≤ 20mb)';
      }
    });

    // Caption Feature UI Handlers
    toggleCaptionBtn.addEventListener('click', () => {
      isCaptionActive = !isCaptionActive;
      updateCaptionUI();
      if (isCaptionActive) {
        captionInput.focus();
      }
    });

    clearCaptionBtn.addEventListener('click', () => {
      captionInput.value = '';
      isCaptionActive = false;
      updateCaptionUI();
    });

    captionInput.addEventListener('input', () => {
      updateLiveCaptionPreview();
    });

    function updateCaptionUI() {
      if (isCaptionActive) {
        captionEditorPanel.classList.remove('hidden');
        clearCaptionBtn.classList.remove('hidden');
        captionBtnIcon.textContent = '&minus;';
        captionBtnText.textContent = 'ocultar editor de legenda';
        updateLiveCaptionPreview();
      } else {
        captionEditorPanel.classList.add('hidden');
        if (!captionInput.value.trim()) {
          clearCaptionBtn.classList.add('hidden');
          captionLiveBanner.classList.add('hidden');
        }
        captionBtnIcon.textContent = '+';
        captionBtnText.textContent = captionInput.value.trim() ? 'editar legenda' : 'adicionar legenda (caption)';
      }
    }

    function updateLiveCaptionPreview() {
      const text = captionInput.value.trim();
      if (text) {
        captionLiveBanner.textContent = text;
        captionLiveBanner.classList.remove('hidden');
      } else {
        captionLiveBanner.classList.add('hidden');
      }
    }

    // Paste
    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          tweetUrlInput.value = text.trim();
          fetchMedia();
        }
      } catch (err) {
        showStatus('Cole manualmente com Ctrl+V.', true);
      }
    });

    // Form submit
    urlForm.addEventListener('submit', (e) => {
      e.preventDefault();
      fetchMedia();
    });

    // Local file
    localFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      hideStatus();
      resultContainer.classList.add('hidden');
      const blobUrl = URL.createObjectURL(file);
      activeMediaList = [{ url: blobUrl, isLocal: true }];
      selectedMediaIndex = 0;
      loadSelectedMedia();
    });

    /**
     * Fetch media from tweet
     */
    async function fetchMedia() {
      const input = tweetUrlInput.value.trim();
      const id = extractTweetId(input);

      if (!id) {
        showStatus('Insira um link válido do Twitter/X.', true);
        return;
      }

      hideStatus();
      previewContainer.classList.add('hidden');
      resultContainer.classList.add('hidden');
      mediaSelector.classList.add('hidden');
      showStatus('Buscando mídia do post...');
      fetchBtn.disabled = true;

      let foundVideos = [];

      // Try VxTwitter API
      try {
        const res = await fetch(`https://api.vxtwitter.com/Twitter/status/${id}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.media_extended)) {
            data.media_extended.forEach(m => {
              if ((m.type === 'video' || m.type === 'gif') && m.url) {
                foundVideos.push(m.url);
              }
            });
          } else if (Array.isArray(data.mediaURLs)) {
            data.mediaURLs.forEach(u => {
              if (u.endsWith('.mp4') || u.includes('video.twimg.com')) {
                foundVideos.push(u);
              }
            });
          }
        }
      } catch (e) {}

      // Fallback: FxTwitter API
      if (foundVideos.length === 0) {
        try {
          const res = await fetch(`https://api.fxtwitter.com/status/${id}`);
          if (res.ok) {
            const json = await res.json();
            if (json.tweet?.media?.videos) {
              json.tweet.media.videos.forEach(v => {
                if (v.url) foundVideos.push(v.url);
              });
            }
          }
        } catch (e) {}
      }

      // Fallback: CORS Proxy
      if (foundVideos.length === 0) {
        try {
          const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(`https://api.vxtwitter.com/Twitter/status/${id}`)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) {
            const data = await res.json();
            (data.media_extended || []).forEach(m => {
              if ((m.type === 'video' || m.type === 'gif') && m.url) {
                foundVideos.push(m.url);
              }
            });
          }
        } catch (e) {}
      }

      fetchBtn.disabled = false;

      if (foundVideos.length === 0) {
        showStatus('Nenhum vídeo ou GIF encontrado no post.', true);
        return;
      }

      hideStatus();
      activeMediaList = foundVideos.map(url => ({ url, isLocal: false }));
      selectedMediaIndex = 0;

      // Render media switcher if > 1
      if (activeMediaList.length > 1) {
        mediaSelector.innerHTML = activeMediaList.map((m, idx) => `
          <button type="button" class="px-2.5 py-1 text-xs font-mono border rounded ${idx === 0 ? 'bg-white text-black border-white' : 'bg-neutral-900 border-neutral-800 text-neutral-400'}" data-index="${idx}">
            vídeo ${idx + 1}
          </button>
        `).join('');
        mediaSelector.classList.remove('hidden');

        mediaSelector.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedMediaIndex = parseInt(btn.dataset.index);
            mediaSelector.querySelectorAll('button').forEach((b, i) => {
              b.className = `px-2.5 py-1 text-xs font-mono border rounded ${i === selectedMediaIndex ? 'bg-white text-black border-white' : 'bg-neutral-900 border-neutral-800 text-neutral-400'}`;
            });
            loadSelectedMedia();
          });
        });
      }

      loadSelectedMedia();
    }

    function loadSelectedMedia() {
      const media = activeMediaList[selectedMediaIndex];
      if (!media) return;

      previewVideo.src = media.url;
      previewVideo.load();
      previewVideo.play().catch(() => {});
      previewContainer.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      updateLiveCaptionPreview();
    }

    /**
     * Resolve CORS blob
     */
    async function getCORSVideoBlobUrl(videoUrl) {
      if (videoUrl.startsWith('blob:')) return videoUrl;

      try {
        const res = await fetch(videoUrl, { mode: 'cors' });
        if (res.ok) {
          const b = await res.blob();
          return URL.createObjectURL(b);
        }
      } catch (e) {}

      // Proxy fallback
      const proxies = [
        `https://corsproxy.io/?url=${encodeURIComponent(videoUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(videoUrl)}`
      ];

      for (const p of proxies) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            const b = await res.blob();
            return URL.createObjectURL(b);
          }
        } catch (e) {}
      }

      return videoUrl;
    }

    /**
     * Computes optimal line wrapping and box height for esmbot-style caption
     */
    function computeCaptionLayout(text, width) {
      if (!text || !text.trim()) {
        return { lines: [], fontSize: 0, lineHeight: 0, paddingY: 0, captionHeight: 0 };
      }

      // Base font size relative to video width + 4pt boost
      const fontSize = Math.max(20, Math.round(width * 0.086) + 5);
      const maxTextWidth = width * 0.90; // 5% padding left and right

      const measureCanvas = document.createElement('canvas');
      const ctx = measureCanvas.getContext('2d');
      ctx.font = `bold ${fontSize}px "Futura Condensed Extra Bold", "Futura", sans-serif`;

      const paragraphs = text.trim().split('\n');
      const lines = [];

      for (const paragraph of paragraphs) {
        const words = paragraph.split(/\s+/).filter(Boolean);
        let currentLine = '';

        for (const word of words) {
          const testLine = currentLine ? `${currentLine} ${word}` : word;
          const metrics = ctx.measureText(testLine);

          if (metrics.width <= maxTextWidth) {
            currentLine = testLine;
          } else {
            if (currentLine) lines.push(currentLine);
            currentLine = word;
          }
        }
        if (currentLine) lines.push(currentLine);
      }

      const lineHeight = Math.round(fontSize * 1.15);
      const paddingY = Math.round(fontSize * 0.45);
      const captionHeight = (lines.length * lineHeight) + (paddingY * 2);

      return {
        lines,
        fontSize,
        lineHeight,
        paddingY,
        captionHeight
      };
    }

    /**
     * Convert to GIF with Caption Banner & 8MB/20MB limit
     */
    convertBtn.addEventListener('click', startConversion);

    async function startConversion() {
      const media = activeMediaList[selectedMediaIndex];
      if (!media || !media.url) return;

      if (!window.gifshot) {
        showStatus('Biblioteca carregando, tente novamente em segundos...', true);
        return;
      }

      const selectedMode = modeSelect.value;
      const maxAllowedBytes = LIMITS[selectedMode] || LIMITS.discord;
      const maxLimitLabel = selectedMode === 'discord' ? '8.0 MB' : '20.0 MB';

      const captionText = captionInput.value.trim();
      const hasCaption = captionText.length > 0;

      hideStatus();
      resultContainer.classList.add('hidden');
      progressContainer.classList.remove('hidden');
      convertBtn.disabled = true;

      timerCount = 0;
      progressTimer.textContent = '0s';
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerCount++;
        progressTimer.textContent = `${timerCount}s`;
      }, 1000);

      try {
        progressText.textContent = 'carregando vídeo...';
        progressBar.style.width = '15%';

        const cleanBlobUrl = await getCORSVideoBlobUrl(media.url);
        const duration = previewVideo.duration && isFinite(previewVideo.duration) ? previewVideo.duration : 4;

        // Base parameters according to mode
        let targetDuration, targetWidth, targetFps;
        if (selectedMode === 'discord') {
          targetDuration = Math.min(duration, 6);
          targetWidth = 480;
          targetFps = 15;
        } else {
          targetDuration = Math.min(duration, 9);
          targetWidth = 600;
          targetFps = 20;
        }

        let pass = 0;
        let finalBlob = null;
        let finalObj = null;

        while (pass < 3) {
          pass++;
          progressText.textContent = `renderizando gif (${targetWidth}px, ${targetFps}fps)...`;
          progressBar.style.width = `${25 + pass * 25}%`;

          const interval = 1 / targetFps;
          const numFrames = Math.max(6, Math.min(Math.round(targetDuration * targetFps), selectedMode === 'discord' ? 70 : 110));

          if (!hasCaption) {
            // Direct fast video path when no caption
            finalObj = await new Promise((resolve, reject) => {
              gifshot.createGIF({
                video: [cleanBlobUrl],
                gifWidth: targetWidth,
                gifHeight: Math.round(targetWidth * (previewVideo.videoHeight / (previewVideo.videoWidth || 1)) || targetWidth * 0.5625),
                interval: interval,
                numFrames: numFrames,
                sampleInterval: selectedMode === 'discord' ? 10 : 8,
                numWorkers: navigator.hardwareConcurrency ? Math.min(navigator.hardwareConcurrency, 4) : 2,
                progressCallback: (p) => {
                  progressBar.style.width = `${25 + p * 65}%`;
                }
              }, (obj) => {
                if (obj.error) return reject(new Error(obj.errorMsg || 'Erro ao gerar GIF.'));
                resolve(obj);
              });
            });
          } else {
            // Caption path: render frames with solid white top banner and Futura font
            progressText.textContent = `desenhando legenda no GIF (Passe ${pass})...`;
            
            const captionLayout = computeCaptionLayout(captionText, targetWidth);
            const videoRatio = previewVideo.videoHeight / (previewVideo.videoWidth || 1) || 0.5625;
            const videoRenderHeight = Math.round(targetWidth * videoRatio);
            const totalCanvasHeight = videoRenderHeight + captionLayout.captionHeight;

            // Sample video frames
            const offscreenVideo = document.createElement('video');
            offscreenVideo.src = cleanBlobUrl;
            offscreenVideo.muted = true;
            offscreenVideo.playsInline = true;
            offscreenVideo.crossOrigin = 'anonymous';

            await new Promise((res, rej) => {
              offscreenVideo.onloadeddata = res;
              offscreenVideo.onerror = rej;
              offscreenVideo.load();
            });

            const frameCanvas = document.createElement('canvas');
            frameCanvas.width = targetWidth;
            frameCanvas.height = totalCanvasHeight;
            const ctx = frameCanvas.getContext('2d');

            const capturedFrames = [];
            const timeStep = targetDuration / numFrames;

            for (let f = 0; f < numFrames; f++) {
              const seekTime = f * timeStep;
              offscreenVideo.currentTime = seekTime;
              
              await new Promise(r => {
                const onSeek = () => {
                  offscreenVideo.removeEventListener('seeked', onSeek);
                  r();
                };
                offscreenVideo.addEventListener('seeked', onSeek);
              });

              // 1. Draw solid white caption box
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, targetWidth, captionLayout.captionHeight);

              // 2. Draw black bold text centered
              ctx.fillStyle = '#000000';
              ctx.font = `bold ${captionLayout.fontSize}px "Futura Condensed Extra Bold", "Futura", sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';

              const startY = captionLayout.paddingY + (captionLayout.lineHeight / 2);
              captionLayout.lines.forEach((line, i) => {
                ctx.fillText(line, targetWidth / 2, startY + (i * captionLayout.lineHeight));
              });

              // 3. Draw video frame underneath caption
              ctx.drawImage(offscreenVideo, 0, captionLayout.captionHeight, targetWidth, videoRenderHeight);

              capturedFrames.push(frameCanvas.toDataURL('image/png'));
              progressBar.style.width = `${20 + Math.round((f / numFrames) * 45)}%`;
            }

            // Encode frames to GIF
            progressText.textContent = `comprimindo GIF (&le; ${maxLimitLabel})...`;
            finalObj = await new Promise((resolve, reject) => {
              gifshot.createGIF({
                images: capturedFrames,
                gifWidth: targetWidth,
                gifHeight: totalCanvasHeight,
                interval: interval,
                numFrames: numFrames,
                sampleInterval: selectedMode === 'discord' ? 10 : 8,
                numWorkers: navigator.hardwareConcurrency ? Math.min(navigator.hardwareConcurrency, 4) : 2,
                progressCallback: (p) => {
                  progressBar.style.width = `${65 + p * 30}%`;
                }
              }, (obj) => {
                if (obj.error) return reject(new Error(obj.errorMsg || 'Erro ao codificar GIF.'));
                resolve(obj);
              });
            });
          }

          // Measure size in bytes
          const base64 = finalObj.image.split(',')[1];
          const byteChars = atob(base64);
          const byteNums = new Array(byteChars.length);
          for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
          finalBlob = new Blob([new Uint8Array(byteNums)], { type: 'image/gif' });

          if (finalBlob.size <= maxAllowedBytes) {
            break;
          }

          // If > limit, scale down
          progressText.textContent = `ajustando para <= ${maxLimitLabel} (${formatBytes(finalBlob.size)})...`;
          const scale = Math.sqrt(maxAllowedBytes / finalBlob.size) * 0.88;
          targetWidth = Math.max(240, Math.floor((targetWidth * scale) / 2) * 2);
          targetFps = Math.max(10, Math.round(targetFps * scale));
          targetDuration = Math.min(targetDuration, selectedMode === 'discord' ? 5 : 7);
        }

        clearInterval(timerInterval);
        progressContainer.classList.add('hidden');
        convertBtn.disabled = false;

        currentGifBlob = finalBlob;
        displayGif(finalBlob, maxLimitLabel);

      } catch (err) {
        clearInterval(timerInterval);
        progressContainer.classList.add('hidden');
        convertBtn.disabled = false;
        showStatus(err.message || 'Erro durante a conversão.', true);
      }
    }

    function displayGif(blob, maxLimitLabel) {
      const url = URL.createObjectURL(blob);
      resultGif.src = url;
      gifSizeText.textContent = formatBytes(blob.size);
      gifLimitText.textContent = `(≤ ${maxLimitLabel})`;
      
      downloadLink.href = url;
      downloadLink.download = `discord_gif_${Date.now()}.gif`;

      resultContainer.classList.remove('hidden');
      resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Copy to clipboard
    copyBtn.addEventListener('click', async () => {
      if (!currentGifBlob) return;
      try {
        copyBtn.textContent = 'copiando...';
        if (navigator.clipboard && window.ClipboardItem) {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/gif': currentGifBlob })
            ]);
            copyBtn.textContent = 'copiado!';
          } catch (e) {
            await navigator.clipboard.writeText(downloadLink.href);
            copyBtn.textContent = 'link copiado!';
          }
        } else {
          await navigator.clipboard.writeText(downloadLink.href);
          copyBtn.textContent = 'link copiado!';
        }
        setTimeout(() => copyBtn.textContent = 'copiar', 2000);
      } catch (err) {
        copyBtn.textContent = 'erro';
        setTimeout(() => copyBtn.textContent = 'copiar', 2000);
      }
    });
  </script>
</body>
</html>
